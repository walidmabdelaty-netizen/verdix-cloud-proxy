name: Verdix Cloud Internet (Proxy)
on:
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Install and Configure Squid Proxy
      run: |
        sudo apt-get update
        sudo apt-get install -y squid
        sudo sed -i 's/http_port 3128/http_port 8080/' /etc/squid/squid.conf
        sudo service squid restart

    - name: Install Cloudflare Tunnel
      run: |
        wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        mv cloudflared-linux-amd64 cloudflared

    - name: Start Tunnel and Output Link
      run: |
        ./cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
        sleep 10
        echo "======================================================="
        echo "!!! VERDIX CLOUD PROXY IS READY !!!"
        grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log
        echo "======================================================"

    - name: Keep Alive
      run: sleep 21000
