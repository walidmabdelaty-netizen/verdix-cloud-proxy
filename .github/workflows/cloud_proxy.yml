name: Verdix Cloud Proxy

on:
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Squid
        run: |
          sudo apt-get update
          sudo apt-get install -y squid

      - name: Configure and Start Squid
        run: |
          sudo sed -i 's/http_port 3128/http_port 8080/' /etc/squid/squid.conf
          sudo service squid restart
          echo "Squid restarted on port 8080"

      - name: Start Tunnel and Keep Alive
        run: |
          # استخدام localhost.run بدون تفاعل (لأن بيئة جيت هب مفيش فيها مستخدم يكتب yes)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:8080 nokey@localhost.run > tunnel.log 2>&1 &
          sleep 10
          cat tunnel.log
          # الحفاظ على التشغيل لمدة 6 ساعات
          sleep 21000
